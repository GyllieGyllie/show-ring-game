<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12241A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Show Ring — build and ride a jumping course</title>

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12241A}
a{color:#E8B54A}a:hover{color:#F3CF7A}
input[type=range]{accent-color:#C8402F;width:100%;margin:0;height:28px}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #E8B54A;outline-offset:2px}
</style>

<style>html,body{height:100%;overscroll-behavior:none}</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/htm-preact-standalone.umd.js"></script>
<script>
(function () {
  var html = htmPreact.html;
  var tplFn = new Function('v', 'html', 'with (v) { return html`' + '<div style="height: 100vh; display: flex; flex-direction: column; background: #12241A; color: #F1EDE2; font-family: \'Figtree\', \'Segoe UI\', system-ui, sans-serif; overflow: hidden">\n\n${(isBuild) ? html`\n<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 16px; border-bottom: 1px solid #2C4A39; background: #152B1F">\n  <div style="display: flex; align-items: center; gap: 10px">\n    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8B54A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><circle cx="12" cy="9" r="2.6"></circle><path d="M9 14.2 7 22l3-1.6L12 22l2-1.6 3 1.6-2-7.8"></path></svg>\n    <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1">Show Ring</div>\n  </div>\n  <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A9B8AC">Course\n    <input value=${courseName} onInput=${setName} aria-label="Course name" style="background: #0F1F16; color: #F1EDE2; border: 1px solid #2C4A39; border-radius: 8px; padding: 8px 10px; width: 170px; font-size: 15px" />\n  </label>\n  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: #A9B8AC">\n    <label style="display: flex; align-items: center; gap: 8px">Width\n      <input type="range" min="20" max="100" step="5" value=${arenaW} onInput=${setW} style="width: 96px" />\n      <span style="color: #F1EDE2; font-weight: 600; min-width: 38px">${arenaW} m</span>\n    </label>\n    <label style="display: flex; align-items: center; gap: 8px">Length\n      <input type="range" min="20" max="80" step="5" value=${arenaL} onInput=${setL} style="width: 96px" />\n      <span style="color: #F1EDE2; font-weight: 600; min-width: 38px">${arenaL} m</span>\n    </label>\n  </div>\n  <select value="" onChange=${loadPreset} aria-label="Load a course" style="background: #0F1F16; color: #F1EDE2; border: 1px solid #2C4A39; border-radius: 8px; padding: 8px 10px; font-size: 14px; min-height: 40px">\n    <option value="">Load a course…</option>\n    <option value="classic">Classic 1.10 m · 8 fences</option>\n    <option value="warmup">Warm-up · 4 fences</option>\n    <option value="empty">Empty arena</option>\n  </select>\n  <div style="flex: 1 1 0; min-width: 0"></div>\n  <div style="display: flex; gap: 8px; flex-wrap: wrap">\n    ${(canUndo) ? html`\n      <button onClick=${undo} style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2C4A39; background: transparent; color: #F1EDE2; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Undo</button>\n    ` : null}\n    <button onClick=${watch} style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E8B54A; background: transparent; color: #E8B54A; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>Watch a round</button>\n    <button onClick=${ride} style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #C8402F; color: #FFFFFF; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5L7 4.5Z"></path></svg>Ride it</button>\n  </div>\n</header>\n\n<main style="flex: 1 1 0; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; padding: 12px">\n  <section style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 12px; background: #1B3226; border: 1px solid #2C4A39; border-radius: 12px; padding: 14px; box-sizing: border-box">\n    <h2 style="margin: 0; font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Add obstacle</h2>\n    <div style="display: flex; flex-wrap: wrap; gap: 8px">\n      <button onClick=${addVertical} style="flex: 1 1 150px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; text-align: left; font-weight: 600">\n        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="15.5" y="6" width="3" height="22" fill="#C8402F"></rect><rect x="13" y="3" width="8" height="4" fill="#F4F1EA"></rect><rect x="13" y="27" width="8" height="4" fill="#F4F1EA"></rect></svg>Vertical</button>\n      <button onClick=${addOxer} style="flex: 1 1 150px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; text-align: left; font-weight: 600">\n        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="10" y="6" width="3" height="22" fill="#2F5FB8"></rect><rect x="21" y="6" width="3" height="22" fill="#2F5FB8"></rect><rect x="8" y="3" width="7" height="4" fill="#F4F1EA"></rect><rect x="19" y="3" width="7" height="4" fill="#F4F1EA"></rect><rect x="8" y="27" width="7" height="4" fill="#F4F1EA"></rect><rect x="19" y="27" width="7" height="4" fill="#F4F1EA"></rect></svg>Oxer</button>\n      <button onClick=${addTriple} style="flex: 1 1 150px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; text-align: left; font-weight: 600">\n        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="6" y="6" width="3" height="22" fill="#2E7D4F"></rect><rect x="15.5" y="6" width="3" height="22" fill="#2E7D4F"></rect><rect x="25" y="6" width="3" height="22" fill="#2E7D4F"></rect><rect x="4" y="3" width="26" height="4" fill="#F4F1EA"></rect><rect x="4" y="27" width="26" height="4" fill="#F4F1EA"></rect></svg>Triple bar</button>\n      <button onClick=${addWall} style="flex: 1 1 150px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; text-align: left; font-weight: 600">\n        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="13.5" y="6" width="7" height="22" fill="#A8432F"></rect><rect x="12" y="2" width="10" height="5" fill="#F4F1EA"></rect><rect x="12" y="27" width="10" height="5" fill="#F4F1EA"></rect></svg>Wall</button>\n      <button onClick=${addLiverpool} style="flex: 1 1 150px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; text-align: left; font-weight: 600">\n        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="7" y="5" width="20" height="24" rx="2" fill="#3F86C9"></rect><rect x="15.5" y="6" width="3" height="22" fill="#C8402F"></rect><rect x="13" y="2" width="8" height="4" fill="#F4F1EA"></rect><rect x="13" y="28" width="8" height="4" fill="#F4F1EA"></rect></svg>Liverpool</button>\n    </div>\n    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #A9B8AC">Drag a fence to move it. Drag the gold handle to turn it. The arrow is the jumping direction, with the red flag on the right. Fences are jumped in number order.</p>\n  </section>\n\n  <section style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 8px">\n    <div style="flex: 1 1 auto; background: #1B3226; border: 1px solid #2C4A39; border-radius: 12px; padding: 8px; display: flex; align-items: center; justify-content: center; box-sizing: border-box">\n      <svg ref=${setSvg} viewBox=${viewBox} preserveAspectRatio="xMidYMid meet" onPointerDown=${svgDown} onPointerMove=${svgMove} onPointerUp=${svgUp} onPointerCancel=${svgUp} role="img" aria-label="Arena plan" style="width: 100%; height: auto; max-height: calc(100vh - 150px); display: block; touch-action: none; user-select: none; -webkit-user-select: none">\n        <rect x="0" y="0" width=${arenaW} height=${arenaL} rx="0.6" fill="#D8C49B" stroke="#F4F1EA" stroke-width="0.35"></rect>\n        ${(gridLines||[]).map((gl, $index) => html`\n          <line x1=${gl.x1} y1=${gl.y1} x2=${gl.x2} y2=${gl.y2} stroke="#C3AC80" stroke-width="0.07"></line>\n        `)}\n        ${(rulers||[]).map((ru, $index) => html`\n          <text x=${ru.x} y=${ru.y} font-size="1.1" fill="#7F9484" text-anchor="middle">${ru.t}</text>\n        `)}\n        <polyline points=${pathPoints} fill="none" stroke="#24382B" stroke-opacity="0.6" stroke-width="0.22" stroke-dasharray="0.9 0.7" stroke-linecap="round" stroke-linejoin="round"></polyline>\n        ${(strideLabels||[]).map((sl, $index) => html`\n          <text x=${sl.x} y=${sl.y} font-size="1.05" fill="#5A4524" text-anchor="middle" font-weight="700">${sl.t}</text>\n        `)}\n        ${(items||[]).map((it, $index) => html`\n          <g transform=${it.transform} onPointerDown=${it.onDown} style="cursor: grab">\n            <rect x=${it.hit.x} y=${it.hit.y} width=${it.hit.w} height=${it.hit.h} rx="0.4" fill=${it.hitFill} stroke=${it.hitStroke} stroke-width="0.14" stroke-dasharray="0.5 0.35"></rect>\n            <path d=${it.arrow} fill="none" stroke="#12241A" stroke-opacity="0.7" stroke-width="0.18"></path>\n            <path d=${it.head} fill="#12241A" fill-opacity="0.7"></path>\n            ${(it.parts||[]).map((pt, $index) => html`\n              <rect x=${pt.x} y=${pt.y} width=${pt.w} height=${pt.h} rx=${pt.rx} fill=${pt.fill} stroke="#1B2A20" stroke-width="0.05"></rect>\n            `)}\n          </g>\n        `)}\n        ${(labels||[]).map((lb, $index) => html`\n          <g pointer-events="none">\n            <circle cx=${lb.x} cy=${lb.y} r="1.05" fill=${lb.bg}></circle>\n            <text x=${lb.x} y=${lb.ty} font-size="1.25" text-anchor="middle" fill="#F1EDE2" font-weight="700">${lb.t}</text>\n          </g>\n        `)}\n        ${(handles||[]).map((hd, $index) => html`\n          <g transform=${hd.transform}>\n            <line x1=${hd.x1} y1="0" x2=${hd.hx} y2="0" stroke="#E8B54A" stroke-width="0.16"></line>\n            <circle cx=${hd.hx} cy="0" r="1.1" fill="#E8B54A" stroke="#12241A" stroke-width="0.12" onPointerDown=${hd.onRot} style="cursor: alias"></circle>\n          </g>\n        `)}\n      </svg>\n    </div>\n    <div style="display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #A9B8AC; padding: 0 4px">\n      <span>Course <strong style="color: #F1EDE2">${courseLen} m</strong></span>\n      <span>Time allowed <strong style="color: #F1EDE2">${ta} s</strong></span>\n      <span>Fences <strong style="color: #F1EDE2">${fenceCount}</strong></span>\n      <span>Grid 5 m · dashed line = riding line</span>\n    </div>\n  </section>\n\n  <aside style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 16px; background: #1B3226; border: 1px solid #2C4A39; border-radius: 12px; padding: 16px; box-sizing: border-box">\n\n    ${(hasFence) ? html`\n      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">\n        <div>\n          <div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #A9B8AC">Fence ${selNum} of ${fenceCount}</div>\n          <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">${selType}</div>\n        </div>\n        <div style="display: flex; gap: 6px">\n          <button onClick=${moveEarlier} aria-label="Jump this fence earlier" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>\n          <button onClick=${moveLater} aria-label="Jump this fence later" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>\n        </div>\n      </div>\n      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">\n        <span style="display: flex; justify-content: space-between"><span style="color: #A9B8AC">Height</span><strong>${selH}</strong></span>\n        <input type="range" min="0.6" max="1.6" step="0.05" value=${selHVal} onInput=${setH} />\n      </label>\n      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">\n        <span style="display: flex; justify-content: space-between"><span style="color: #A9B8AC">Rail length</span><strong>${selWidth}</strong></span>\n        <input type="range" min="2.5" max="4.5" step="0.1" value=${selWidthVal} onInput=${setWidth} />\n      </label>\n      ${(hasSpread) ? html`\n        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">\n          <span style="display: flex; justify-content: space-between"><span style="color: #A9B8AC">Spread</span><strong>${selSpread}</strong></span>\n          <input type="range" min="0.6" max="2.2" step="0.1" value=${selSpreadVal} onInput=${setSpread} />\n        </label>\n      ` : null}\n      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">\n        <label style="display: flex; flex-direction: column; gap: 6px">\n          <span style="display: flex; justify-content: space-between"><span style="color: #A9B8AC">Direction</span><strong>${selRot}°</strong></span>\n          <input type="range" min="0" max="355" step="5" value=${selRotVal} onInput=${setRot} />\n        </label>\n        <div style="display: flex; gap: 6px">\n          <button onClick=${rotLeft} aria-label="Turn 15 degrees left" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>15°</button>\n          <button onClick=${rotRight} aria-label="Turn 15 degrees right" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>15°</button>\n          <button onClick=${flip} aria-label="Jump from the other side" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"></path><path d="M3 8h14"></path><path d="m17 20 4-4-4-4"></path><path d="M21 16H7"></path></svg>Flip</button>\n        </div>\n      </div>\n      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">\n        <span style="color: #A9B8AC">Colour</span>\n        <div style="display: flex; gap: 10px; flex-wrap: wrap">\n          ${(swatches||[]).map((sw, $index) => html`\n            <button onClick=${sw.pick} aria-label=${sw.label} style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #F4F1EA; background: ${sw.bg}; box-shadow: ${sw.ring}"></button>\n          `)}\n        </div>\n      </div>\n      <div style="font-size: 14px; color: #A9B8AC; border-top: 1px solid #2C4A39; padding-top: 12px">To next fence: <strong style="color: #F1EDE2">${selGap}</strong></div>\n      <div style="display: flex; gap: 8px">\n        <button onClick=${duplicate} style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>Duplicate</button>\n        <button onClick=${remove} style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #7A2E24; background: transparent; color: #F2A79C; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path></svg>Remove</button>\n      </div>\n      <button onClick=${deselect} style="min-height: 44px; border-radius: 10px; border: 0; background: transparent; color: #E8B54A; font-weight: 600; text-decoration: underline">Back to course plan</button>\n    ` : null}\n\n    ${(hasMarker) ? html`\n      <div>\n        <div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #A9B8AC">Timing line</div>\n        <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">${markerName}</div>\n      </div>\n      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">\n        <span style="display: flex; justify-content: space-between"><span style="color: #A9B8AC">Direction</span><strong>${selRot}°</strong></span>\n        <input type="range" min="0" max="355" step="5" value=${selRotVal} onInput=${setRot} />\n      </label>\n      <div style="display: flex; gap: 6px">\n        <button onClick=${rotLeft} aria-label="Turn 15 degrees left" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2">15° left</button>\n        <button onClick=${rotRight} aria-label="Turn 15 degrees right" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2">15° right</button>\n        <button onClick=${flip} style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2">Flip</button>\n      </div>\n      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #A9B8AC">The clock starts when you cross the start line and stops at the finish line.</p>\n      <button onClick=${deselect} style="min-height: 44px; border-radius: 10px; borde    </div>\n  </div>\n\n  ${(showControls) ? html`\n    <div style="position: absolute; left: 12px; bottom: 14px; display: flex; align-items: center; gap: 10px">\n      <button onPointerDown=${slowDown} onPointerUp=${speedRelease} onPointerLeave=${speedRelease} onPointerCancel=${speedRelease} aria-label="Slower" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(241,237,226,0.5); background: rgba(10,22,15,0.75); color: #F1EDE2; display: flex; align-items: center; justify-content: center; touch-action: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>\n      <div style="background: rgba(10,22,15,0.82); border-radius: 12px; padding: 8px 12px; text-align: center; min-width: 76px">\n        <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">${hudGait}</div>\n        <div style="font-size: 12px; color: #A9B8AC">${hudSpeed} m/min</div>\n      </div>\n      <button onPointerDown=${speedUp} onPointerUp=${speedRelease} onPointerLeave=${speedRelease} onPointerCancel=${speedRelease} aria-label="Faster" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(241,237,226,0.5); background: rgba(10,22,15,0.75); color: #F1EDE2; display: flex; align-items: center; justify-content: center; touch-action: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>\n    </div>\n    <button onPointerDown=${jumpBtn} aria-label="Jump" style="position: absolute; right: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 3px solid #F1EDE2; background: #C8402F; color: #FFFFFF; font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 6px 24px rgba(0,0,0,0.35); touch-action: none">Jump</button>\n    <div style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 12px; color: rgba(241,237,226,0.75); white-space: nowrap; pointer-events: none">${controlsHint}</div>\n  ` : null}\n\n  ${(watching) ? html`\n    <div style="position: absolute; left: 12px; bottom: 14px; background: rgba(10,22,15,0.82); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; pointer-events: none">Watching a computer-ridden round · ${hudGait} ${hudSpeed} m/min</div>\n  ` : null}\n\n  ${(hasCountdown) ? html`\n    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">\n      <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 140px; color: #F1EDE2; text-shadow: 0 6px 30px rgba(0,0,0,0.45)">${countdown}</div>\n    </div>\n  ` : null}\n\n  ${(hasToast) ? html`\n    <div style="position: absolute; left: 50%; top: 32%; transform: translateX(-50%); pointer-events: none">\n      <div style="padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 20px; white-space: nowrap; background: ${toastBg}; color: ${toastFg}; box-shadow: 0 6px 24px rgba(0,0,0,0.3)">${toastText}</div>\n    </div>\n  ` : null}\n\n  ${(hasResult) ? html`\n    <div style="position: absolute; inset: 0; background: rgba(8,16,11,0.72); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; overflow: auto">\n      <div role="dialog" aria-label="Round result" style="width: 100%; max-width: 520px; background: #152B1F; border: 1px solid #2C4A39; border-radius: 16px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">\n        <div>\n          <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #A9B8AC">${resKicker}</div>\n          <div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 48px; line-height: 1.05; color: ${resColor}">${resTitle}</div>\n        </div>\n        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">\n          <div style="background: #12241A; border-radius: 10px; padding: 10px"><div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #A9B8AC">Time</div><div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 24px">${resTime}</div></div>\n          <div style="background: #12241A; border-radius: 10px; padding: 10px"><div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #A9B8AC">Allowed</div><div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 24px">${resTa} s</div></div>\n          <div style="background: #12241A; border-radius: 10px; padding: 10px"><div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #A9B8AC">Jumping</div><div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 24px">${resJf}</div></div>\n          <div style="background: #12241A; border-radius: 10px; padding: 10px"><div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #A9B8AC">Time faults</div><div style="font-family: \'Big Shoulders Display\', \'Arial Narrow\', sans-serif; font-weight: 800; font-size: 24px">${resTf}</div></div>\n        </div>\n        <div style="display: flex; flex-wrap: wrap; gap: 6px">\n          ${(resChips||[]).map((ch, $index) => html`\n            <div style="display: flex; flex-direction: column; align-items: center; min-width: 40px; padding: 6px 4px; border-radius: 8px; background: ${ch.bg}; color: ${ch.fg}"><span style="font-size: 11px; opacity: 0.85">${ch.n}</span><span style="font-weight: 700; font-size: 14px">${ch.st}</span></div>\n          `)}\n        </div>\n        <div style="display: flex; flex-wrap: wrap; gap: 8px">\n          <button onClick=${rideAgain} style="flex: 1 1 140px; min-height: 48px; border-radius: 10px; border: 0; background: #C8402F; color: #FFFFFF; font-weight: 700">Ride again</button>\n          <button onClick=${watchAgain} style="flex: 1 1 140px; min-height: 48px; border-radius: 10px; border: 1px solid #E8B54A; background: transparent; color: #E8B54A; font-weight: 700">Watch a round</button>\n          <button onClick=${exitRide} style="flex: 1 1 140px; min-height: 48px; border-radius: 10px; border: 1px solid #2C4A39; background: #213D2E; color: #F1EDE2; font-weight: 700">Edit course</button>\n        </div>\n      </div>\n    </div>\n  ` : null}\n</div>\n` : null}\n\n</div>' + '`; }');
  window.DCLogic = class extends htmPreact.Component {
    render() { return tplFn(this.renderVals(), html); }

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let course = null, rounds = [];
    try { course = JSON.parse(window.localStorage.getItem('showring.course.v1') || 'null'); } catch (e) {}
    try { rounds = JSON.parse(window.localStorage.getItem('showring.rounds.v1') || '[]') || []; } catch (e) {}
    if (!course || !Array.isArray(course.fences) || !course.start || !course.finish) course = this.preset('classic');
    this.state = { screen: 'build', course: course, sel: null, auto: false, guide: true, muted: false, hud: null, toast: null, result: null, rounds: rounds, countdown: null, undoN: 0 };
    this.accel = 0;
    this.undoStack = [];
  }

  /* ---------- constants & course data ---------- */
  K() {
    if (!this._K) this._K = {
      types: {
        vertical: { label: 'Vertical', spread: 0 },
        oxer: { label: 'Oxer', spread: 1.2 },
        triple: { label: 'Triple bar', spread: 1.8 },
        wall: { label: 'Wall', spread: 0 },
        liverpool: { label: 'Liverpool', spread: 0 }
      },
      colors: {
        red: { label: 'Red and white', main: '#C8402F' },
        blue: { label: 'Blue and white', main: '#2F5FB8' },
        green: { label: 'Green and white', main: '#2E7D4F' },
        yellow: { label: 'Yellow and white', main: '#E3B23C' },
        black: { label: 'Black and white', main: '#2A2A2A' }
      }
    };
    return this._K;
  }
  uid() { return 'f' + Math.random().toString(36).slice(2, 9); }
  mkFence(type, x, y, rot, h, extra) {
    return Object.assign({ id: this.uid(), type: type, x: x, y: y, rot: rot, h: h, width: 3.6, spread: this.K().types[type].spread, color: 'red' }, extra || {});
  }
  preset(name) {
    const f = (t, x, y, r, h, e) => this.mkFence(t, x, y, r, h, e);
    if (name === 'warmup') return { name: 'Warm-up', w: 60, l: 40, start: { x: 12, y: 30, rot: 0 }, finish: { x: 6, y: 17, rot: 90 }, fences: [
      f('vertical', 24, 30, 0, 0.8, { color: 'blue' }), f('oxer', 42, 30, 0, 0.85, { color: 'green' }),
      f('vertical', 42, 10, 180, 0.9, { color: 'yellow' }), f('oxer', 22, 10, 180, 0.9, { color: 'blue' })] };
    if (name === 'empty') return { name: 'New course', w: 60, l: 40, start: { x: 10, y: 20, rot: 0 }, finish: { x: 50, y: 20, rot: 0 }, fences: [] };
    return { name: 'Classic 1.10 m', w: 60, l: 40, start: { x: 12, y: 34, rot: 0 }, finish: { x: 48, y: 24, rot: 0 }, fences: [
      f('vertical', 24, 34, 0, 1.0), f('oxer', 44, 34, 0, 1.05, { color: 'blue' }),
      f('vertical', 54, 18, 270, 1.1, { color: 'green' }), f('triple', 40, 6, 180, 1.05, { color: 'yellow' }),
      f('vertical', 26, 6, 180, 1.1), f('oxer', 18.5, 6, 180, 1.1, { color: 'blue' }),
      f('liverpool', 8, 22, 90, 1.1, { color: 'blue' }), f('wall', 30, 24, 0, 1.1)] };
  }
  fenceGeom(f) {
    const h = f.h, S = f.spread || 0;
    let els, half;
    if (f.type === 'oxer') { els = [{ x: -S / 2, h: h - 0.05 }, { x: S / 2, h: h }]; half = S / 2 + 0.15; }
    else if (f.type === 'triple') { els = [{ x: -S / 2, h: h * 0.6 }, { x: 0, h: h * 0.8 }, { x: S / 2, h: h }]; half = S / 2 + 0.15; }
    else if (f.type === 'wall') { els = [{ x: 0, h: h }]; half = 0.3; }
    else if (f.type === 'liverpool') { els = [{ x: 0, h: h }]; half = 1.1; }
    else { els = [{ x: 0, h: h }]; half = 0.15; }
    let minX = 1e9, maxX = -1e9, hMax = 0;
    els.forEach(e => { minX = Math.min(minX, e.x); maxX = Math.max(maxX, e.x); hMax = Math.max(hMax, e.h); });
    return { els: els, half: half, minX: minX, maxX: maxX, hMax: hMax };
  }

  /* ---------- riding line ---------- */

      dist = Math.max(0, nf.sC + nf.g.minX - r.s);
      const e = r.s - this.jumpParams(nf, r.v).sIdeal;
      if (!r.jump && r.phase === 'riding' && e > -9 && e < 1.8) guideLeft = Math.max(0, Math.min(100, (e + 6) / 8 * 100)).toFixed(1) + '%';
    }
    if (r.phase === 'finishing' || r.phase === 'done') { next = 'Finished'; dist = 0; }
    const gait = r.v < 0.5 ? 'Halt' : r.v < 3.8 ? 'Trot' : r.v < 7.2 ? 'Canter' : 'Gallop';
    this.setState({ hud: { time: r.time.toFixed(2), faults: r.faults, ta: P.ta, next: next, dist: next === 'Finished' ? '' : Math.round(dist) + ' m', guideLeft: guideLeft, gait: gait, speed: Math.round(r.v * 60) } });
  }
  toast(text, tone, ms) {
    clearTimeout(this._toastT);
    this.setState({ toast: { text: text, tone: tone || 'info' } });
    this._toastT = setTimeout(() => this.setState({ toast: null }), ms || 1100);
  }

  /* ---------- render ---------- */
  bindRefs() {
    this.refs_ = {
      setSvg: el => { this.svgEl = el; },
      setCanvas: el => this.onCanvas(el),
      setRideEl: el => { this.rideEl = el; if (el) setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) {} }, 60); }
    };
  }
  renderVals() {
    if (!this.refs_) this.bindRefs();
    const st = this.state, c = st.course, K = this.K();
    const isRide = st.screen === 'ride';
    const v = {
      isBuild: !isRide, isRide: isRide,
      setSvg: this.refs_.setSvg, setCanvas: this.refs_.setCanvas, setRideEl: this.refs_.setRideEl,
      courseName: c.name || '', arenaW: c.w, arenaL: c.l, canUndo: st.undoN > 0,
      setName: e => { const val = e.target.value.slice(0, 40); this.updateCourse(cc => { cc.name = val; }, true); },
      setW: e => this.setArena('w', +e.target.value), setL: e => this.setArena('l', +e.target.value),
      loadPreset: e => { const val = e.target.value; if (!val) return; this.pushUndo(); const pc = this.preset(val); this.setState({ course: pc, sel: null, undoN: this.undoStack.length }); this.save(pc); },
      undo: () => this.undo(),
      ride: () => this.goRide(false), watch: () => this.goRide(true),
      addVertical: () => this.addFence('vertical'), addOxer: () => this.addFence('oxer'), addTriple: () => this.addFence('triple'),
      addWall: () => this.addFence('wall'), addLiverpool: () => this.addFence('liverpool'),
      svgDown: () => { if (!this.drag && this.state.sel) this.setState({ sel: null }); },
      svgMove: e => this.dragMove(e), svgUp: e => this.dragEnd(e),
      deselect: () => this.setState({ sel: null }),
      // ride
      keyDown: e => this.onKey(e, true), keyUp: e => this.onKey(e, false),
      canvasTap: e => { if (e.pointerType !== 'mouse' || e.button === 0) this.doJump(); },
      jumpBtn: e => { e.preventDefault(); this.ensureAudio(); this.doJump(); },
      speedUp: e => { e.preventDefault(); this.accel = 1; }, slowDown: e => { e.preventDefault(); this.accel = -1; }, speedRelease: () => { this.accel = 0; },
      exitRide: () => this.exitRide(),
      rideAgain: () => { this.setState({ auto: false }); this.newRun(); },
      watchAgain: () => { this.setState({ auto: true }); this.newRun(); },
      toggleMute: () => this.setState({ muted: !st.muted }), soundOn: !st.muted, soundOff: st.muted, muteLabel: st.muted ? 'Turn sound on' : 'Turn sound off',
      toggleGuide: () => this.setState({ guide: !st.guide }), guideLabel: st.guide ? 'Guide on' : 'Guide off'
    };
    if (isRide) {
      const h = st.hud || { time: '0.00', faults: 0, ta: '–', next: '', dist: '', guideLeft: null, gait: 'Halt', speed: 0 };
      Object.assign(v, {
        hudTime: h.time, hudFaults: h.faults, hudFaultColor: h.faults ? '#F2A79C' : '#F1EDE2', hudTa: h.ta, hudNext: h.next, hudDist: h.dist,
        hudShowGuide: !!(st.guide && h.guideLeft && !st.auto), hudGuideLeft: h.guideLeft || '0%', hudGait: h.gait, hudSpeed: h.speed,
        showControls: !st.auto && !st.result, watching: st.auto && !st.result,
        controlsHint: 'Tap the view or press Space to jump · hold + / − for pace',
        hasCountdown: !!st.countdown, countdown: st.countdown || '',
        hasToast: !!st.toast, toastText: st.toast ? st.toast.text : '',
        toastBg: st.toast && st.toast.tone === 'good' ? '#E8B54A' : st.toast && st.toast.tone === 'bad' ? '#C8402F' : 'rgba(10,22,15,0.85)',
        toastFg: st.toast && st.toast.tone === 'good' ? '#1B1A12' : '#FFFFFF',
        hasResult: !!st.result
      });
      const rs = st.result;
      if (rs) Object.assign(v, {
        resKicker: (rs.auto ? 'Watched round · ' : 'Your round · ') + (c.name || 'Course'),
        resTitle: rs.elim ? 'Eliminated' : rs.total === 0 ? 'Clear round' : rs.total + (rs.total === 1 ? ' fault' : ' faults'),
        resColor: rs.elim ? '#F2A79C' : rs.total === 0 ? '#E8B54A' : '#F1EDE2',
        resTime: rs.time, resTa: rs.ta, resJf: rs.jf, resTf: rs.tf, resChips: rs.chips
      });
      return v;
    }
    // ---------- builder ----------
    const P = this.buildPath(c);
    const W = c.w, L = c.l, sel = st.sel;
    v.viewBox = '-4 -4 ' + (W + 8) + ' ' + (L + 8);
    const grid = [];
    for (let x = 5; x < W; x += 5) grid.push({ x1: x, y1: 0, x2: x, y2: L });
    for (let y = 5; y < L; y += 5) grid.push({ x1: 0, y1: y, x2: W, y2: y });
    v.gridLines = grid;
    const rul = [];
    for (let x = 10; x < W; x += 10) rul.push({ x: x, y: -1.2, t: x + ' m' });
    v.rulers = rul;
    const pts = [];
    for (let i = 0; i < P.N; i += 4) pts.push(P.px[i].toFixed(2) + ',' + P.py[i].toFixed(2));
    v.pathPoints = pts.join(' ');
    v.strideLabels = P.gaps.filter(gp => gp && gp.strides).map(gp => { const p = this.posAt(P, gp.s); return { x: p.x.toFixed(2), y: (p.y - 0.6).toFixed(2), t: gp.strides + ' str' }; });
    const R = Math.PI / 180, items = [], labels = [], handles = [];
    const mkItem = (id, it, parts, hit, half, label, bg) => {
      const selected = sel === id;
      const tail = -(half + 1.6), tip = half + 1.9;
      items.push({ transform: 'translate(' + it.x + ' ' + it.y + ') rotate(' + it.rot + ')', parts: parts, hit: hit,
        hitFill: selected ? 'rgba(232,181,74,0.22)' : 'rgba(0,0,0,0)', hitStroke: selected ? '#E8B54A' : 'none',
        arrow: 'M ' + tail + ' 0 L ' + (tip - 0.6) + ' 0', head: 'M ' + tip + ' 0 L ' + (tip - 0.85) + ' -0.55 L ' + (tip - 0.85) + ' 0.55 Z',
        onDown: e => this.beginDrag(e, id, 'move') });
      const lx = Math.sin(it.rot * R), ly = -Math.cos(it.rot * R), off = -hit.y + 0.6;
      labels.push({ x: (it.x + lx * off).toFixed(2), y: (it.y + ly * off).toFixed(2), ty: (it.y + ly * off + 0.45).toFixed(2), t: label, bg: bg });
      if (selected) handles.push({ transform: 'translate(' + it.x + ' ' + it.y + ') rotate(' + it.rot + ')', x1: tip, hx: tip + 2.2, onRot: e => this.beginDrag(e, id, 'rotate') });
    };
    c.fences.forEach((f, i) => {
      const g = this.fenceGeom(f), Wd = f.width, col = (K.colors[f.color] || K.colors.red).main, parts = [];
      if (f.type === 'liverpool') parts.push({ x: -1.1, y: -Wd / 2 - 0.2, w: 2.2, h: Wd + 0.4, fill: '#3F86C9', rx: 0.25 });
      if (f.type === 'wall') {
        parts.push({ x: -0.3, y: -Wd / 2, w: 0.6, h: Wd, fill: col, rx: 0.05 });
        parts.push({ x: -0.4, y: -Wd / 2 - 0.8, w: 0.8, h: 0.8, fill: '#F4F1EA', rx: 0.05 }, { x: -0.4, y: Wd / 2, w: 0.8, h: 0.8, fill: '#F4F1EA', rx: 0.05 });
      } else {
        const xs = [];
        g.els.forEach(e => { if (xs.indexOf(e.x) < 0) xs.push(e.x); parts.push({ x: e.x - 0.09, y: -Wd / 2, w: 0.18, h: Wd, fill: col, rx: 0.05 }); });
        xs.forEach(x => { parts.push({ x: x - 0.22, y: -Wd / 2 - 0.45, w: 0.44, h: 0.45, fill: '#F4F1EA', rx: 0.05 }, { x: x - 0.22, y: Wd / 2, w: 0.44, h: 0.45, fill: '#F4F1EA', rx: 0.05 }); });
      }
      parts.push({ x: g.minX - 0.15, y: Wd / 2 + 0.55, w: 0.3, h: 0.3, fill: '#C8402F', rx: 0.02 });
      const hx0 = Math.min(g.minX, -g.half) - 1.0, hx1 = Math.max(g.maxX, g.half) + 1.0;
      mkItem(f.id, f, parts, { x: hx0, y: -Wd / 2 - 1.1, w: hx1 - hx0, h: Wd + 2.2 }, g.half, String(i + 1), '#12241A');
    });
    const lineParts = [{ x: -0.07, y: -2.4, w: 0.14, h: 4.8, fill: '#F4F1EA', rx: 0 }, { x: -0.25, y: -2.65, w: 0.5, h: 0.5, fill: '#F4F1EA', rx: 0.25 }, { x: -0.25, y: 2.15, w: 0.5, h: 0.5, fill: '#C8402F', rx: 0.25 }];
    mkItem('start', c.start, lineParts, { x: -1.6, y: -3.3, w: 3.2, h: 6.6 }, 0.2, 'S', '#2E7D4F');
    mkItem('finish', c.finish, lineParts, { x: -1.6, y: -3.3, w: 3.2, h: 6.6 }, 0.2, 'F', '#C8402F');
    Object.assign(v, { items: items, labels: labels, handles: handles });
    v.courseLen = Math.round(P.length); v.ta = P.ta; v.fenceCount = c.fences.length;
    const fIdx = c.fences.findIndex(f => f.id === sel), sf = fIdx >= 0 ? c.fences[fIdx] : null;
    const marker = sel === 'start' ? c.start : sel === 'finish' ? c.finish : null;
    v.hasFence = !!sf; v.hasMarker = !!marker; v.noSel = !sf && !marker;
    const cur = sf || marker;
    v.selRot = cur ? cur.rot : 0; v.selRotVal = v.selRot;
    v.setRot = e => this.patchSel({ rot: +e.target.value });
    v.rotLeft = () => this.rotBy(-15); v.rotRight = () => this.rotBy(15); v.flip = () => this.rotBy(180);
    v.markerName = sel === 'finish' ? 'Finish' : 'Start';
    if (sf) {
      Object.assign(v, {
        selNum: fIdx + 1, selType: K.types[sf.type].label,
        selH: sf.h.toFixed(2) + ' m', selHVal: sf.h, setH: e => this.patchSel({ h: +e.target.value }),
        selWidth: sf.width.toFixed(1) + ' m', selWidthVal: sf.width, setWidth: e => this.patchSel({ width: +e.target.value }),
        hasSpread: sf.type === 'oxer' || sf.type === 'triple', selSpread: (sf.spread || 0).toFixed(1) + ' m', selSpreadVal: sf.spread || 0, setSpread: e => this.patchSel({ spread: +e.target.value }),
        swatches: Object.keys(K.colors).map(k => ({ label: K.colors[k].label, bg: K.colors[k].main, ring: sf.color === k ? '0 0 0 3px #E8B54A' : 'none', pick: () => this.patchSel({ color: k }) })),
        selGap: this.gapText(P.gaps[fIdx]),
        moveEarlier: () => { if (fIdx > 0) this.updateCourse(cc => { const t = cc.fences[fIdx]; cc.fences[fIdx] = cc.fences[fIdx - 1]; cc.fences[fIdx - 1] = t; }); },
        moveLater: () => { if (fIdx < c.fences.length - 1) this.updateCourse(cc => { const t = cc.fences[fIdx]; cc.fences[fIdx] = cc.fences[fIdx + 1]; cc.fences[fIdx + 1] = t; }); },
        duplicate: () => { if (c.fences.length >= 24) return; const nf = Object.assign({}, sf, { id: this.uid(), x: Math.min(W, sf.x + 6), y: Math.min(L, sf.y + 3) }); this.updateCourse(cc => { cc.fences.splice(fIdx + 1, 0, nf); }); this.setState({ sel: nf.id }); },
        remove: () => { this.updateCourse(cc => { cc.fences.splice(fIdx, 1); }); this.setState({ sel: null }); }
      });
    }
    v.noFences = c.fences.length === 0;
    v.planRows = c.fences.map((f, i) => ({ n: i + 1, type: K.types[f.type].label, h: f.h.toFixed(2) + ' m', gap: P.gaps[i] ? '→ ' + this.gapText(P.gaps[i]) : 'last', pick: () => this.setState({ sel: f.id }) }));
    v.rounds = (st.rounds || []).map(rd => ({ name: rd.name, line: rd.line }));
    v.hasRounds = v.rounds.length > 0;
    return v;
  }
  onKey(e, down) {
    const k = e.key;
    if (k === ' ' || k === 'Enter') { if (down && !e.repeat && !this.state.result) { e.preventDefault(); this.doJump(); } }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); this.accel = down ? 1 : 0; }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); this.accel = down ? -1 : 0; }
    else if (k === 'Escape' && down) this.exitRide();
  }
}

htmPreact.render(htmPreact.h(Component, {}), document.getElementById('app'));
</script>
